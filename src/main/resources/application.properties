spring.application.name=Heimdall
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/heimdall}
spring.datasource.username=${DB_USERNAME:heimdall}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
heimdall.jwt.secret=${HEIMDALL_JWT_SECRET:}
heimdall.jwt.expiration=${HEIMDALL_JWT_EXPIRATION:PT15M}
heimdall.jwt.issuer=${HEIMDALL_JWT_ISSUER:heimdall}
